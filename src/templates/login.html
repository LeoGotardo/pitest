<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Login — PiTest</title>
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">Pi<span>Test</span></div>
      <p class="login-subtitle">Diagnóstico de Hardware</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}" class="login-form" autocomplete="off">
        <input type="hidden" name="next" value="{{ next }}">

        <div class="login-field">
          <label for="username">Usuário</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            autofocus
            {% if locked_for %}disabled{% endif %}
            required
          >
        </div>

        <div class="login-field">
          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            {% if locked_for %}disabled{% endif %}
            required
          >
        </div>

        <button type="submit" class="login-btn" {% if locked_for %}disabled{% endif %}>
          Entrar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
